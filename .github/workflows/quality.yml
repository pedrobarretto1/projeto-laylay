name: qualidade

on:
  push:
  pull_request:

jobs:
  verificar:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - name: Instalar dependências
        run: python -m pip install -r requirements-dev.txt
      - name: Compilar, analisar, testar e auditar
        shell: pwsh
        run: .\scripts\verificar_qualidade.ps1 -Python python
