<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Laylay Home — Dispositivos</title><style>*{box-sizing:border-box}body{margin:0;background:#12111b;color:#eee;font:16px system-ui,sans-serif}main{max-width:760px;margin:auto;padding:28px 18px}header{display:flex;align-items:center;justify-content:space-between;gap:12px}h1{font-size:28px;color:#c4b5fd}a{color:#c4b5fd}p,small{color:#bdb8cb}.card{background:#232030;border:1px solid #383149;border-radius:16px;padding:20px;margin:14px 0}button{cursor:pointer;border:0;border-radius:10px;padding:13px 18px;color:white;background:#6d4cc2;font:inherit}button:disabled{opacity:.45;cursor:default}.off{background:#a2394d}.row{display:flex;gap:10px;flex-wrap:wrap}.online{color:#86efac}#status{min-height:24px}h2{font-size:20px;margin:0 0 10px}</style></head><body><main><header><h1>Laylay Home</h1><a href="/conta">Minha conta</a></header><p>Controle os dispositivos liberados pelo proprietário, sem login.</p><p>Modo de demonstração: use somente dispositivos de teste, sem carga perigosa.</p><div class="row"><button id="refresh">Atualizar dispositivos</button></div><p id="status" role="status" aria-live="polite">Buscando dispositivos…</p><div id="devices"></div><small>O estado indica o último comando informado pelo ESP32, não a posição física do relé.</small></main><script>
const list=document.getElementById('devices'),status=document.getElementById('status');let busy=false;async function load(){if(busy)return;busy=true;try{const r=await fetch('/api/public/devices',{cache:'no-store'});if(!r.ok)throw Error('Servidor indisponível');const ds=await r.json();list.replaceChildren();status.textContent=ds.length?'Dispositivos disponíveis: '+ds.length:'Nenhum dispositivo liberado. O proprietário pode liberar um dispositivo em Minha conta.';for(const d of ds){const c=document.createElement('section');c.className='card';const h=document.createElement('h2');h.textContent=d.name;const p=document.createElement('p');p.textContent=d.online?'Online — '+(d.state==='1'?'Ligado':'Desligado'):'Offline';if(d.online)p.className='online';const row=document.createElement('div');row.className='row';for(const [action,label] of [['1','Ligar'],['0','Desligar']]){const b=document.createElement('button');b.textContent=label;b.disabled=!d.online;if(action==='0')b.className='off';b.onclick=()=>send(d.id,action,row);row.append(b)}c.append(h,p,row);list.append(c)}}catch(e){status.textContent=e.message}finally{busy=false}}
async function send(id,action,row){if(busy)return;busy=true;row.querySelectorAll('button').forEach(b=>b.disabled=true);try{status.textContent='Aguardando confirmação do ESP32…';const r=await fetch('/api/public/control',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id,action})});if(!r.ok)throw Error(await r.text());const state=await r.text();status.textContent=state===action?'Comando confirmado.':'Estado não confirmado.';}catch(e){status.textContent='Falha: '+e.message}finally{busy=false;setTimeout(load,1000)}}document.getElementById('refresh').onclick=load;load();setInterval(load,8000);
</script></body></html>
